 Sans', sans-serif; font-size:16px; font-weight:bold; color:#16210F; line-height:1.25; width:320px;">Règles de restitution</div></foreignObject><line x1="20.96" y1="526.28" x2="24.88" y2="530.2" stroke="#2E7D32" stroke-width="2.4" stroke-linecap="round"/><line x1="24.88" y1="530.2" x2="31.32" y2="521.8" stroke="#2E7D32" stroke-width="2.4" stroke-linecap="round"/><foreignObject x="42" y="519" width="298" height="13.75"><div xmlns="http://www.w3.org/1999/xhtml" style="margin:0; padding:0; font-family:Roboto, 'Noto Sans', 'DejaVu Sans', sans-serif; font-size:11px; font-weight:normal; color:#5C6B59; line-height:1.25; width:298px;">Restituer à la date convenue, ou prévenir le propriétaire.</div></foreignObject><line x1="20.96" y1="545.13" x2="24.88" y2="549.05" stroke="#2E7D32" stroke-width="2.4" stroke-linecap="round"/><line x1="24.88" y1="549.05" x2="31.32" y2="540.65" stroke="#2E7D32" stroke-width="2.4" stroke-linecap="round"/><foreignObject x="42" y="537.85" width="298" height="13.75"><div xmlns="http://www.w3.org/1999/xhtml" style="margin:0; padding:0; font-family:Roboto, 'Noto Sans', 'DejaVu Sans', sans-serif; font-size:11px; font-weight:normal; color:#5C6B59; line-height:1.25; width:298px;">Rapporter l'objet propre et complet, accessories inclus.</div></foreignObject><line x1="20.96" y1="563.98" x2="24.88" y2="567.9" stroke="#2E7D32" stroke-width="2.4" stroke-linecap="round"/><line x1="24.88" y1="567.9" x2="31.32" y2="559.5" stroke="#2E7D32" stroke-width="2.4" stroke-linecap="round"/><foreignObject x="42" y="556.7" width="298" height="13.75"><div xmlns="http://www.w3.org/1999/xhtml" style="margin:0; padding:0; font-family:Roboto, 'Noto Sans', 'DejaVu Sans', sans-serif; font-size:11px; font-weight:normal; color:#5C6B59; line-height:1.25; width:298px;">Signaler tout dégât plutôt que de le dissimuler.</div></foreignObject><rect x="0" y="728" width="360" height="72" style="fill:#FFFFFF"/><line x1="0" y1="728" x2="360" y2="728" stroke="#DFE4DF" stroke-width="1" stroke-